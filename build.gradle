plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.ladysnake.org/releases" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.shedaniel.me/" }
    flatDir { dirs "libs" }
}

loom { }

// 启动前服务器更新选择器：两个不依赖 Minecraft 类的嵌套 mod，通过 jar-in-jar 打进本模组。
// Fabric 按 mod id 字典序构造语言适配器，AutoModpack 在自己的适配器里完成 preload：
// - a_habitrain_prelaunch（src/prelaunch）排在 automodpack 之前，只关闭它本次启动的自动更新；
// - habitrain_prelaunch_late（src/prelaunchLate）排在它之后，弹出选择窗口并调用 AutoModpack 完成下载。
sourceSets {
    prelaunch
    prelaunchLate {
        compileClasspath += prelaunch.output
    }
}

[processPrelaunchResources, processPrelaunchLateResources].each { task ->
    task.configure {
        def version = project.version
        inputs.property "version", version
        filesMatching("fabric.mod.json") {
            expand "version": version
        }
    }
}

def prelaunchJar = tasks.register("prelaunchJar", Jar) {
    from(sourceSets.prelaunch.output)
    archiveBaseName = "habitrain_prelaunch"
    destinationDirectory = layout.buildDirectory.dir("prelaunch-libs")
}

def prelaunchLateJar = tasks.register("prelaunchLateJar", Jar) {
    from(sourceSets.prelaunchLate.output)
    archiveBaseName = "habitrain_prelaunch_late"
    destinationDirectory = layout.buildDirectory.dir("prelaunch-libs")
}

// Loom 的 include 不接受文件依赖，直接交给 remapJar 嵌套（会写入 fabric.mod.json 的 jars）。
remapJar {
    nestedJars.from(prelaunchJar, prelaunchLateJar)
}

dependencies {
    prelaunchCompileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
    prelaunchCompileOnly "com.google.code.gson:gson:2.10.1"
    prelaunchLateCompileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
    prelaunchLateCompileOnly "com.google.code.gson:gson:2.10.1"
    // 只用于编译：late 半部分直接调用 AutoModpack 4.0.x 的客户端类（运行时由玩家安装的 AutoModpack 提供）。
    prelaunchLateCompileOnly files("libs/automodpack-mc1.21.1-fabric-4.0.6.jar")

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "com.terraformersmc:modmenu:11.0.3"
    // Upstream already requires Cloth Config; its ConfigData type is needed by the hat controls.
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:15.0.140") { transitive = false }
    modImplementation files("libs/star_rail_express-4.3.0.jar")
    // 通过 v2 RoleCatalogApi 读取有效角色目录；运行时需要 core 类。
    // 审核 D-02：依赖必须带版本号，否则「core 改了/删了类而下游不知道」的漂移无法被发现
    //（旧的无版本号 habitrain_core.jar 就比 2.0.7 还旧，却一直让下游“能编”）。
    // 审核 B-01 / M-01 / N-01：2.0.12 起 core 提供 api.MatchRestStateApi 与
    // api.role.v2.RoleVisibilityApi，本模组不再越层引用 core 实现层。
    // 2.0.19：core 主线合入公开 API 层改造（CoreApi / spi / scene.asset 等新公开类型），
    // 本模组随基线一起升级并针对 2.0.19 重新构建验证。
    // fabric.mod.json 的 depends 同步为 "habitrain_core": ">=2.0.19"。
    modImplementation files("libs/habitrain_core-2.0.19.jar")
    modImplementation("org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.1") { transitive = false }
    modImplementation("org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.1") { transitive = false }

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    testImplementation files("libs/automodpack-mc1.21.1-fabric-4.0.6.jar")
    // 运行时由 stageTestRuntime 单独放入 prelaunch/prelaunchLate 目录，避免目录内容被平铺进 libs。
    testCompileOnly sourceSets.prelaunch.output
    testCompileOnly sourceSets.prelaunchLate.output
}

afterEvaluate {
    configurations.testCompileClasspath.extendsFrom(
            configurations.getByName("minecraftNamedCompile")
    )
    configurations.testRuntimeClasspath.extendsFrom(
            configurations.getByName("minecraftNamedRuntime")
    )
}

def workspacePathHash = java.security.MessageDigest.getInstance("SHA-256")
        .digest(rootDir.canonicalPath.getBytes("UTF-8"))
        .encodeHex().toString().substring(0, 12)
def stagedTestRuntimeBase = new File(gradle.gradleUserHomeDir, "habitrain-lottery-test-runtime/${workspacePathHash}")
// B-25: Reap any leftover run-<pid>-* staging dirs from terminated processes, then allocate a
// per-invocation ASCII staging directory + tmpdir so concurrent `./gradlew test --no-daemon`
// runs in the same workspace never collide on staged JARs, classes, or java.io.tmpdir.
if (stagedTestRuntimeBase.isDirectory()) {
    stagedTestRuntimeBase.listFiles()?.each { child ->
        if (!child.isDirectory()) return
        def matcher = (child.name =~ /^run-(\d+)-[0-9a-f]+$/)
        if (!matcher.matches()) return
        try {
            long pid = Long.parseLong(matcher.group(1))
            if (pid != ProcessHandle.current().pid()
                    && !ProcessHandle.of(pid).map { it.isAlive() }.orElse(false)) {
                child.deleteDir()
            }
        } catch (Throwable ignored) {
        }
    }
}
def testRunInvocationId = "${ProcessHandle.current().pid()}-${UUID.randomUUID().toString().substring(0, 8)}"
def stagedTestInvocationDir = new File(stagedTestRuntimeBase, "run-${testRunInvocationId}")
def stagedTestRuntimeDir = new File(stagedTestInvocationDir, "classpath")
def stagedTestTempDir = new File(stagedTestInvocationDir, "tmp")
def stagedTestBinaryResultsDir = new File(stagedTestInvocationDir, "binary-results")
def stagedTestXmlReportDir = new File(stagedTestInvocationDir, "junit-xml")
def stagedTestHtmlReportDir = new File(stagedTestInvocationDir, "html-report")

tasks.named("clean") {
    doLast {
        if (stagedTestRuntimeBase.isDirectory()) {
            stagedTestRuntimeBase.listFiles()?.each { child ->
                if (!child.name.startsWith("run-") && !child.name.endsWith(".lock")) {
                    try { child.deleteDir(); child.delete() } catch (Throwable ignored) {}
                }
            }
        }
    }
}

tasks.register("stageTestRuntime", Sync) {
    dependsOn(tasks.named("testClasses"))
    into(stagedTestRuntimeDir)
    from(sourceSets.test.output.classesDirs) {
        into("test")
    }
    from(sourceSets.main.output) {
        into("main")
    }
    from(sourceSets.prelaunch.output) {
        into("prelaunch")
    }
    from(sourceSets.prelaunchLate.output) {
        into("prelaunchLate")
    }
    from(configurations.testRuntimeClasspath) {
        into("libs")
    }
}

def copyDirectoryBestEffort
copyDirectoryBestEffort = { File srcDir, File dstDir ->
    if (srcDir == null || !srcDir.isDirectory()) return
    dstDir.mkdirs()
    srcDir.listFiles()?.each { entry ->
        File target = new File(dstDir, entry.name)
        if (entry.isDirectory()) {
            copyDirectoryBestEffort(entry, target)
        } else {
            java.nio.file.Files.copy(
                    entry.toPath(),
                    target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

def cleanupStagedTestRuntime = tasks.register("cleanupStagedTestRuntime") {
    def publishedXmlDir = layout.buildDirectory.dir("test-results/test")
    def publishedHtmlDir = layout.buildDirectory.dir("reports/tests/test")
    doLast {
        try {
            stagedTestRuntimeBase.mkdirs()
            File lockFile = new File(stagedTestRuntimeBase, "publish-reports.lock")
            try (def raf = new java.io.RandomAccessFile(lockFile, "rw");
                 def channel = raf.getChannel();
                 def lock = channel.lock()) {
                copyDirectoryBestEffort(stagedTestXmlReportDir, publishedXmlDir.get().asFile)
                copyDirectoryBestEffort(stagedTestHtmlReportDir, publishedHtmlDir.get().asFile)
            }
        } catch (Throwable ignored) {
        }
        try {
            stagedTestInvocationDir.deleteDir()
        } catch (Throwable ignored) {
            // Best-effort on Windows if mmap handles lag; dead-PID reaper cleans up next run.
        }
    }
}

tasks.named("test", Test).configure {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    systemProperty 'java.io.tmpdir', stagedTestTempDir.absolutePath
    binaryResultsDirectory.set(stagedTestBinaryResultsDir)
    reports.junitXml.outputLocation.set(stagedTestXmlReportDir)
    reports.html.outputLocation.set(stagedTestHtmlReportDir)
    doFirst { stagedTestTempDir.mkdirs() }
    dependsOn(tasks.named("stageTestRuntime"))
    finalizedBy(cleanupStagedTestRuntime)
    // Gradle's Windows test worker corrupts non-ASCII classpath entries.
    testClassesDirs = files(new File(stagedTestRuntimeDir, "test"))
    classpath = files(
            new File(stagedTestRuntimeDir, "test"),
            new File(stagedTestRuntimeDir, "main"),
            new File(stagedTestRuntimeDir, "prelaunch"),
            new File(stagedTestRuntimeDir, "prelaunchLate")
    ) + fileTree(new File(stagedTestRuntimeDir, "libs")) {
        include("*.jar")
    }
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

def releaseOutputDir = rootProject.file("../临时")

tasks.register("copyReleaseJar", Copy) {
    dependsOn(tasks.named("remapJar"))
    from(tasks.named("remapJar").flatMap { it.archiveFile })
    into(releaseOutputDir)
}

tasks.named("assemble") {
    dependsOn(tasks.named("copyReleaseJar"))
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifact(remapJar) {
                builtBy remapJar
            }
            artifact(remapSourcesJar) {
                builtBy remapSourcesJar
            }
        }
    }
    repositories {
        mavenLocal()
    }
}

// Guard the independent component boundary and the empty built-in skin catalog (source + bytecode).
tasks.register('verifyIndependentSkins') {
    dependsOn tasks.named('compileJava')
    doLast {
        def roots = ['api/skin', 'skin']
        def forbiddenSourcePattern = /(?m)^\s*import\s+(?:static\s+)?(io\.wifi|org\.agmas|pro\.fazeclan|net\.exmo\.sre|dev\.doctor4t)\./
        roots.each { dir ->
            fileTree("src/main/java/com/habitrain/lottery/${dir}").matching { include '**/*.java' }.each { source ->
                if (source.getText('UTF-8') =~ forbiddenSourcePattern) {
                    throw new GradleException("Upstream import in independent skin component: ${source}")
                }
            }
        }
        def forbiddenInternalPrefixes = ['io/wifi/', 'org/agmas/', 'pro/fazeclan/', 'net/exmo/sre/', 'dev/doctor4t/']
        def forbiddenDotPrefixes = forbiddenInternalPrefixes.collect { it.replace('/', '.') }
        roots.each { dir ->
            def classRoot = layout.buildDirectory.dir("classes/java/main/com/habitrain/lottery/${dir}").get().asFile
            if (!classRoot.isDirectory()) return
            fileTree(classRoot).matching { include '**/*.class' }.each { classFile ->
                byte[] bytes = classFile.bytes
                // Parse JVM class constant pool CONSTANT_Utf8_info (tag 1) entries directly so no
                // import static, inline FQN, method descriptor, or field type can slip through.
                def dis = new java.io.DataInputStream(new java.io.ByteArrayInputStream(bytes))
                int magic = dis.readInt()
                if (magic != (int) 0xCAFEBABE) throw new GradleException("Invalid class file: ${classFile}")
                dis.readUnsignedShort() // minor
                dis.readUnsignedShort() // major
                int cpCount = dis.readUnsignedShort()
                for (int i = 1; i < cpCount; i++) {
                    int tag = dis.readUnsignedByte()
                    switch (tag) {
                        case 1: // CONSTANT_Utf8
                            String utf = dis.readUTF()
                            if (forbiddenInternalPrefixes.any { utf.contains(it) } || forbiddenDotPrefixes.any { utf.contains(it) }) {
                                throw new GradleException("Upstream bytecode reference '${utf}' in independent skin class: ${classFile}")
                            }
                            break
                        case 3: // Integer
                        case 4: // Float
                            dis.skipBytes(4)
                            break
                        case 5: // Long
                        case 6: // Double
                            dis.skipBytes(8)
                            i++ // takes two constant pool slots
                            break
                        case 7: // Class
                        case 8: // String
                        case 16: // MethodType
                        case 19: // Module
                        case 20: // Package
                            dis.skipBytes(2)
                            break
                        case 9: // Fieldref
                        case 10: // Methodref
                        case 11: // InterfaceMethodref
                        case 12: // NameAndType
                        case 17: // Dynamic
                        case 18: // InvokeDynamic
                            dis.skipBytes(4)
                            break
                        case 15: // MethodHandle
                            dis.skipBytes(3)
                            break
                        default:
                            throw new GradleException("Unknown constant pool tag ${tag} in ${classFile}")
                    }
                }
            }
        }
        ['assets/starrailexpress', 'assets/itemskins', 'data/habitrain_lottery/defaults/skins.json',
         'data/habitrain_lottery/defaults/skins_list.txt'].each { path ->
            if (file("src/main/resources/${path}").exists()) throw new GradleException("Retired skin content: ${path}")
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyIndependentSkins') }
