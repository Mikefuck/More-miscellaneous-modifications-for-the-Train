// Actual Minecraft GUI verification; test-only source set and fixtures, never included in release jars.
// Usage: ./gradlew -I tools/warehouse-smoke.gradle runClient --gradle-user-home ../.gradle-user-home
allprojects {
afterEvaluate { project ->
    repositories {
        maven { url = "https://maven.kosmx.dev/" }
        maven { url = "https://maven.aliyun.com/repository/public/" }
        maven { url = "https://maven.ladysnake.org/releases" }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://maven.uuid.gg/releases" }
        maven { url = "https://maven.bawnorton.com/releases" }
    }
    configurations.modImplementation.dependencies.removeAll { dep ->
        dep instanceof org.gradle.api.artifacts.FileCollectionDependency && dep.files.files.any {
            it.name.startsWith('habitrain_core-') || it.name.startsWith('star_rail_express-')
        }
    }
    dependencies {
        modRuntimeOnly "dev.kosmx.player-anim:player-animation-lib-fabric:2.0.4+1.21.1"
        implementation files("../哈比列车api/libs/star_rail_express-4.3.0-dev.jar")
        // Visual/physics smoke has no voice connection. Omit the optional voice plugin from
        // a test-only copy: its eager SPI lookup otherwise depends on main-entrypoint ordering.
        def coreInput = fileTree('../哈比列车api/build/devlibs') {
            include 'habitrain_core-*-dev.jar'
        }.files.max { it.name }
        if (coreInput == null) throw new GradleException('Missing habitrain_core dev jar for client smoke')
        def coreSmoke = file("build/smoke-inputs/${coreInput.name}")
        coreSmoke.parentFile.mkdirs()
        new java.util.zip.ZipFile(coreInput).withCloseable { source ->
            new java.util.zip.ZipOutputStream(new FileOutputStream(coreSmoke)).withCloseable { output ->
                source.entries().each { entry ->
                    output.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    if (!entry.directory) {
                        byte[] bytes = source.getInputStream(entry).withCloseable { it.readAllBytes() }
                        if (entry.name == 'fabric.mod.json') {
                            def metadata = new groovy.json.JsonSlurper().parse(bytes)
                            metadata.entrypoints.remove('voicechat')
                            bytes = groovy.json.JsonOutput.toJson(metadata).getBytes('UTF-8')
                        }
                        output.write(bytes)
                    }
                    output.closeEntry()
                }
            }
        }
        implementation files(coreSmoke)
        ['wathe-1.3.2.jar', 'ratatouille-1.4.3-1.21.1.jar', 'fabric-carpet-1.21-1.4.147+v240613.jar',
         'voicechat-fabric-1.21.1-2.6.18.jar', 'sre-lib-1.0.3.jar', 'exposure-fabric-1.21.1-1.9.11.jar',
         'ForgeConfigAPIPort-v21.1.6-1.21.1-Fabric.jar', 'architectury-13.0.11-fabric.jar'].each {
            modImplementation files("../哈比列车api/libs/${it}")
        }
        modImplementation "com.terraformersmc:modmenu:11.0.3"
        modImplementation "me.shedaniel.cloth:cloth-config-fabric:15.0.140"
        modImplementation "dev.upcraft.datasync:datasync-minecraft-1.21.1-fabric:0.10.2"
        modImplementation "com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7-beta.1"
        ['base', 'entity', 'world', 'scoreboard'].each {
            modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-${it}:6.1.3"
        }
        implementation "com.zaxxer:HikariCP:5.1.0"
        implementation "com.github.promeg:tinypinyin:2.0.3"
        implementation "com.electronwill.night-config:core:3.8.1"
        implementation "com.electronwill.night-config:toml:3.8.1"
    }
    sourceSets {
        smoke {
            java.srcDir "tools/warehouse-smoke/java"
            resources.srcDir "tools/warehouse-smoke/resources"
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
    }
    loom {
        mods {
            habitrain_warehouse_smoke { sourceSet sourceSets.smoke }
        }
        runs {
            client {
                runDir "build/warehouse-client-run"
                vmArg "-Dmixin.debug.export=true"
            }
        }
    }
    tasks.named("runClient") {
        dependsOn tasks.named("smokeClasses")
        classpath += sourceSets.smoke.output
    }
}
}
